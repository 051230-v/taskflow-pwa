<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TaskFlow · Gestor de tareas</title>
  <meta name="description" content="TaskFlow: gestor de tareas offline con prioridades, fechas límite y filtros. Funciona sin conexión.">
  <meta name="theme-color" content="#1F6F5C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">

  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
</head>
<body>
  <a class="skip-link" href="#lista">Saltar a la lista de tareas</a>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <img class="brand__mark" src="./icon.svg" alt="" width="34" height="34">
        <div class="brand__text">
          <h1>TaskFlow</h1>
          <p id="resumen" class="brand__sub" aria-live="polite">Cargando tareas…</p>
        </div>
      </div>

      <div class="topbar__actions">
        <span id="estadoRed" class="chip chip--online" title="Estado de conexión">En línea</span>
        <button id="btnTema" class="icon-btn" type="button" aria-pressed="false" title="Cambiar tema">
          <span id="iconoTema" aria-hidden="true">◐</span>
          <span class="sr-only">Cambiar entre modo claro y oscuro</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="panel" aria-label="Buscar y filtrar">
      <div class="search">
        <label class="sr-only" for="buscar">Buscar tareas</label>
        <input id="buscar" type="search" placeholder="Buscar por título o nota…" autocomplete="off">
        <button id="btnLimpiarBusqueda" class="search__clear" type="button" hidden>
          <span aria-hidden="true">×</span><span class="sr-only">Borrar búsqueda</span>
        </button>
      </div>

      <div class="filters" role="group" aria-label="Filtrar por estado">
        <button class="tab is-active" type="button" data-filtro="todas" aria-pressed="true">
          Todas <span class="tab__count" data-contador="todas">0</span>
        </button>
        <button class="tab" type="button" data-filtro="pendientes" aria-pressed="false">
          Pendientes <span class="tab__count" data-contador="pendientes">0</span>
        </button>
        <button class="tab" type="button" data-filtro="completadas" aria-pressed="false">
          Completadas <span class="tab__count" data-contador="completadas">0</span>
        </button>
      </div>

      <div class="sortrow">
        <label for="orden">Ordenar por</label>
        <select id="orden">
          <option value="prioridad">Prioridad (alta primero)</option>
          <option value="fecha">Fecha límite (más próxima)</option>
          <option value="titulo">Título (A–Z)</option>
          <option value="creacion">Fecha de creación (reciente)</option>
        </select>
      </div>
    </section>

    <section id="lista" class="list" aria-label="Lista de tareas" aria-live="polite">
      <!-- Las tareas se generan desde app.js -->
    </section>

    <p id="vacio" class="empty" hidden>
      <strong>No hay nada aquí todavía.</strong>
      Crea tu primera tarea con el botón <em>Nueva tarea</em>.
    </p>

    <footer class="foot">
      <p>Datos guardados en este dispositivo con <code>localStorage</code>. Funciona sin conexión.</p>
      <button id="btnReiniciar" class="link-btn" type="button">Restaurar tareas de ejemplo</button>
    </footer>
  </main>

  <button id="btnNueva" class="fab" type="button">
    <span aria-hidden="true">+</span> Nueva tarea
  </button>

  <!-- Formulario de creación / edición -->
  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-cerrar></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <h2 id="modalTitulo">Nueva tarea</h2>

      <div class="field">
        <label for="fTitulo">Título</label>
        <input id="fTitulo" type="text" maxlength="90" placeholder="Ej. Entregar reporte de Física">
        <p id="errTitulo" class="error" hidden>Escribe un título para poder guardar.</p>
      </div>

      <div class="field">
        <label for="fNota">Nota <span class="opt">(opcional)</span></label>
        <textarea id="fNota" rows="3" maxlength="240" placeholder="Detalles, materia, enlaces…"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fPrioridad">Prioridad</label>
          <select id="fPrioridad">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
        <div class="field">
          <label for="fFecha">Fecha límite <span class="opt">(opcional)</span></label>
          <input id="fFecha" type="date">
        </div>
      </div>

      <div class="modal__actions">
        <button id="btnCancelar" class="btn btn--ghost" type="button">Cancelar</button>
        <button id="btnGuardar" class="btn btn--solid" type="button">Guardar tarea</button>
      </div>
    </div>
  </div>

  <div id="aviso" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
